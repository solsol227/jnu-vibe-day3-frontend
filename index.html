<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>제주 미세먼지</title>
  <!-- 지도 라이브러리 Leaflet (CDN) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height:380px; border-radius:8px; }
    #mapinfo { margin-top:10px; }
    :root { --bg:#f6f7f9; --fg:#1b1f24; --card:#fff; --line:#e3e6ea; --muted:#6b7480; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14171a; --fg:#e8eaed; --card:#1e2227; --line:#2e343b; --muted:#98a2ae; }
    }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,"Malgun Gothic",sans-serif; }
    main { max-width:640px; margin:0 auto; padding:20px 16px 40px; }
    h1 { font-size:1.2rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin:12px 0; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:8px 6px; border-bottom:1px solid var(--line); text-align:left; font-size:.92rem; }
    .badge { color:#fff; border-radius:6px; padding:1px 8px; font-size:.8rem; }
    .muted { color:var(--muted); font-size:.85rem; }
    .err { color:#eb5757; }
    button { cursor:pointer; padding:4px 10px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  </style>
</head>
<body>
<main>
  <h1>제주 미세먼지 <span class="muted">(공공데이터 → FastAPI 가공 → Supabase)</span></h1>
  <div id="err" class="err"></div>
  <div id="summary" class="card muted">불러오는 중…</div>
  <div class="card">
    <div id="map"></div>
    <div id="mapinfo" class="muted">지도에서 지역(마커)을 눌러 보세요.</div>
    <div id="unplaced" class="muted"></div>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>측정소</th><th>시각</th><th>PM10</th><th>PM2.5</th><th>예측</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="pred" class="card" hidden></div>
  <div id="detail" class="card" hidden></div>
  <div id="dbstat" class="card muted">DB 저장 현황 불러오는 중…</div>
  <p class="muted">API: <span id="api"></span></p>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script>
  // config.js 가 안 읽히는 환경(파일을 미리보기 창으로 열 때 등)에서도 동작하도록 Railway 주소를 기본값으로
  const API = window.API_URL || "https://jnu-vibe-day3-backend-production.up.railway.app";
  const COLOR = { "좋음":"#2f80ed", "보통":"#27ae60", "나쁨":"#f2994a", "매우나쁨":"#eb5757" };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const badge = (g) => g ? `<span class="badge" style="background:${COLOR[g]}">${esc(g)}</span>` : "-";
  $("api").textContent = API;

  async function getJson(path) {
    const r = await fetch(API + path);
    if (!r.ok) throw new Error(`${path} → ${r.status}`);
    return r.json();
  }

  // 시간(x축)·값(y축) 라벨이 있는 선 그래프. pts = [{time:"YYYY-MM-DD HH:MM", pm10}]
  function chart(pts) {
    const d = pts.filter((p) => p.pm10 != null);
    if (d.length < 2) return '<div class="muted">그래프는 기록이 2개 이상 쌓이면 표시됩니다.</div>';
    const W = 320, H = 170, L = 34, R = 10, T = 12, B = 44;
    const max = Math.max(...d.map((p) => p.pm10), 10), min = 0;
    const x = (i) => L + (i / (d.length - 1)) * (W - L - R);
    const y = (v) => T + (1 - (v - min) / (max - min)) * (H - T - B);
    const line = d.map((p, i) => `${x(i).toFixed(1)},${y(p.pm10).toFixed(1)}`).join(" ");
    const grid = [0, 0.5, 1].map((f) => {
      const v = Math.round(min + f * (max - min)), yy = y(v);
      return `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="currentColor" opacity=".15"/>` +
             `<text x="${L - 4}" y="${yy + 3}" font-size="9" text-anchor="end" fill="currentColor" opacity=".7">${v}</text>`;
    }).join("");
    const n = Math.min(4, d.length);
    const idx = [...new Set(Array.from({ length: n }, (_, k) => Math.round((k * (d.length - 1)) / (n - 1))))];
    const xl = idx.map((i) => {
      const [day, hm] = d[i].time.split(" ");
      return `<text x="${x(i)}" y="${H - 26}" font-size="9" text-anchor="middle" fill="currentColor" opacity=".8">${hm}</text>` +
             `<text x="${x(i)}" y="${H - 14}" font-size="9" text-anchor="middle" fill="currentColor" opacity=".6">${day.slice(5)}</text>`;
    }).join("");
    const dots = d.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.pm10)}" r="3" fill="#2f80ed"><title>${p.time} · PM10 ${p.pm10}</title></circle>`).join("");
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="color:var(--fg)">${grid}` +
           `<polyline points="${line}" fill="none" stroke="#2f80ed" stroke-width="2"/>${dots}${xl}</svg>`;
  }

  async function loadDb() {
    try {
      const d = await getJson("/db/status");
      $("dbstat").innerHTML = `🗄 Supabase 저장 현황: <b>${d.rows}</b>행 누적` +
        (d.first ? ` (${esc(d.first)} ~ ${esc(d.last)})` : "") +
        ` · ${d.mode === "demo" ? "연습 데이터" : "공공데이터"} · 1시간마다 자동 저장`;
    } catch (e) { $("dbstat").textContent = "DB 현황 불러오기 실패: " + e.message; }
  }

  async function showDetail(st) {
    const q = encodeURIComponent(st);
    const [h, c] = await Promise.all([getJson(`/air/history?station=${q}&hours=48`), getJson(`/air/compare?station=${q}`)]);
    let cmp = "어제 같은 시간 기록이 아직 없습니다 (내일 이 시간부터 비교 가능).";
    if (c.yesterday) {
      const d = c.diff_pm10;
      cmp = `지금 ${c.now.pm10} vs 어제 같은 시간 ${c.yesterday.pm10} → ` +
        (d == null ? "-" : `<b>${d > 0 ? "+" : ""}${d}</b>`);
    }
    $("detail").hidden = false;
    $("detail").innerHTML = `<b>${esc(st)}</b> 최근 기록 (PM10, ${h.length}개)${chart(h)}` +
      `<div class="muted">${cmp}</div>`;
  }

  // ── 지도: 백엔드 /air/latest 의 lat, lng 로 측정소 마커를 찍는다 ──
  const GRAY = "#9aa0a6";
  let map = null, layer = null, selectedSt = null;

  function markerIcon(r, selected) {
    const c = COLOR[r.pm10_grade] || GRAY, s = selected ? 44 : 36;
    return L.divIcon({
      className: "", iconSize: [s, s], iconAnchor: [s / 2, s / 2],
      html: `<div style="width:${s}px;height:${s}px;border-radius:50%;background:${c};color:#fff;display:flex;` +
            `align-items:center;justify-content:center;font:bold 13px sans-serif;` +
            `border:${selected ? "3px solid #222" : "2px solid #fff"};box-shadow:0 1px 4px rgba(0,0,0,.45)">${r.pm10 ?? "-"}</div>`,
    });
  }

  function pickStation(rows, st) {
    selectedSt = st;
    const r = rows.find((x) => x.station === st);
    if (!r) return;
    $("mapinfo").innerHTML = `<b style="font-size:1rem;color:var(--fg)">${esc(r.station)}</b> ${esc(r.time)} 기준<br>` +
      `PM10 <b>${r.pm10 ?? "-"}</b> ㎍/㎥ ${badge(r.pm10_grade)} · PM2.5 <b>${r.pm25 ?? "-"}</b> ㎍/㎥ ${badge(r.pm25_grade)}`;
    drawMap(rows);
    showDetail(st).catch((e) => ($("err").textContent = e.message));  // 아래 기록 그래프도 함께
  }

  function drawMap(rows) {
    if (typeof L === "undefined") { $("mapinfo").textContent = "지도 라이브러리를 불러오지 못했습니다."; return; }
    if (!map) {  // 지도는 한 번만 만든다
      map = L.map("map").setView([33.38, 126.55], 10);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        { attribution: "© OpenStreetMap", maxZoom: 18 }).addTo(map);
      layer = L.layerGroup().addTo(map);
    }
    map.off("click");
    const placed = rows.filter((r) => r.lat != null && r.lng != null);
    // 지도 빈 곳을 누르면 가장 가까운 측정소 선택
    map.on("click", (e) => {
      let best = null;
      for (const r of placed) {
        const d = (r.lat - e.latlng.lat) ** 2 + (r.lng - e.latlng.lng) ** 2;
        if (!best || d < best.d) best = { d, r };
      }
      if (best) pickStation(rows, best.r.station);
    });
    layer.clearLayers();
    for (const r of placed) {
      L.marker([r.lat, r.lng], { icon: markerIcon(r, r.station === selectedSt) })
        .on("click", (e) => { L.DomEvent.stopPropagation(e); pickStation(rows, r.station); })
        .bindTooltip(r.station).addTo(layer);
    }
    const no = rows.filter((r) => r.lat == null || r.lng == null);
    $("unplaced").textContent = no.length ? "지도에 표시되지 않은 측정소(좌표 없음): " + no.map((r) => r.station).join(", ") : "";
  }

  async function load() {
    try {
      const [s, rows] = await Promise.all([getJson("/air/summary"), getJson("/air/latest")]);
      $("summary").innerHTML = s.stations
        ? `측정소 ${s.stations}곳 평균 PM10 <b>${s.avg_pm10 ?? "-"}</b> ${badge(s.avg_pm10_grade)}` +
          (s.mode === "demo" ? " <small>(연습 데이터)</small>" : "")
        : "아직 수집된 데이터가 없습니다.";
      $("rows").innerHTML = rows.map((r) => `
        <tr><td>${esc(r.station)}</td><td>${esc(r.time.slice(11))}</td>
        <td>${r.pm10 ?? "-"} ${badge(r.pm10_grade)}</td><td>${r.pm25 ?? "-"} ${badge(r.pm25_grade)}</td>
        <td><button data-st="${esc(r.station)}">1시간 뒤?</button></td></tr>`).join("");
      drawMap(rows);
      $("err").textContent = "";
    } catch (e) {
      $("err").textContent = "백엔드 연결 실패: " + e.message;
    }
  }

  $("rows").addEventListener("click", async (ev) => {
    const st = ev.target.dataset && ev.target.dataset.st;
    if (!st) return;
    const btn = ev.target, label = btn.textContent;
    btn.disabled = true; btn.textContent = "계산 중…";
    $("pred").hidden = false; $("pred").textContent = `${st} 예측 계산 중…`;
    try {
      showDetail(st).catch((e) => ($("err").textContent = e.message));
      const p = await getJson("/air/predict?station=" + encodeURIComponent(st));
      $("pred").hidden = false;
      $("pred").innerHTML = `<b>${esc(p.station)}</b> ` + (p.ready
        ? `1시간 뒤 PM10 약 <b>${p.next_pm10}</b> ${badge(p.next_grade)} (평균 오차 ±${p.avg_error})`
        : esc(p.message));
      $("pred").scrollIntoView({ behavior: "smooth", block: "nearest" });
    } catch (e) {
      $("err").textContent = e.message;
    } finally {
      btn.disabled = false; btn.textContent = label;
    }
  });

  load();
  loadDb();
</script>
</body>
</html>
